name: pr-policy

# Enforces the human gate on pull requests targeting main.
#
# The logic lives in .github/actions/pr-readback, which is written to be
# repository-neutral so it can be extracted to its own repository later. This
# file is the SpaceDonkey-specific configuration of it: which branch is gated,
# which boxes count, and where to send someone who trips it.
#
# The job name below is a required status check on the main ruleset. Changing it
# silently un-gates main, because the ruleset waits forever for a check name that
# no longer reports. Leave it alone.
#
# Threat model, stated plainly: a checkbox in a pull request body is an
# attestation, not a security control. An agent with write access can tick it.
# The real controls are (a) GitHub refuses to merge a draft pull request and
# (b) the ruleset on main requiring an approving review, which an author cannot
# give themselves. Code Owners review is deliberately off, so CODEOWNERS is a
# notification rather than a gate. Nobody bypasses the ruleset, administrators
# included. This workflow makes the process legible and catches the honest
# mistake; it does not defend against a determined one. See
# docs/branch-protection.md for the settings that do.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: human gate for main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/pr-readback
        with:
          base-branch: main
          review-label: I have reviewed my own changes
          attribution-labels: |
            Human-authored
            Agent-assisted
            Agent-authored
          guidance: See AGENTS.md and CONTRIBUTING.md.
