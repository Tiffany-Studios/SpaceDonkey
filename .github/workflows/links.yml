name: links

# External link rot is not the contributor's fault and should not block their
# pull request, so this runs on a schedule and opens an issue instead.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: check external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 "**/*.md"
          fail: false

      - name: open an issue if anything is broken
        if: env.lychee_exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found by the weekly check
          content-filepath: ./lychee/out.md
          labels: chore
